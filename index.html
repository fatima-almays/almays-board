<style>
/* Layout: brand band (logo, title, week picker) → sticky control bar (views, search, custom dropdowns, layout switch) → summary KPIs → collapsible workstream sections shown as cards or list rows. Editing happens in a right-hand drawer. */
:root{
  --brand-deep:#2F463A; --brand:#3A5446; --brand-mid:#4C685A; --leaf:#AEC486; --sage:#728C82; --mist:#CCD2CF;
  --bg:#F3F6F1; --surface:#FFFFFF; --surface-2:#F7F9F5; --surface-3:#EEF2EB; --ink:#1E2B24; --muted:#5F6F67; --line:#DCE3DA; --line-strong:#C6D0C4;
  --accent:#4C685A; --accent-ink:#FFFFFF; --accent-soft:#E7EEDF; --focus:#7FA14A;
  --s-done:#3D8B57; --s-done-bg:#E3F1E6; --s-prog:#B7791F; --s-prog-bg:#FBF0DC; --s-not:#6F7C75; --s-not-bg:#ECEFEC;
  --s-plan:#4C685A; --s-plan-bg:#E7EEDF; --s-late:#C0453A; --s-late-bg:#FBE6E3;
  --p-high:#C0453A; --p-med:#B7791F; --p-low:#6F7C75;
  --c-done:#2F6A47; --c-prog:#D29A33; --c-not:#C3CCC7; --c-hatch:rgba(30,43,36,.18); --grid:#E6EBE4;
  --pop-shadow:0 12px 32px rgba(30,43,36,.16),0 2px 6px rgba(30,43,36,.08);
  --shadow:0 1px 2px rgba(30,43,36,.05),0 6px 18px rgba(30,43,36,.06);
  --font:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:16px; --r-sm:10px; --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1612; --surface:#17201B; --surface-2:#1C2721; --surface-3:#223028; --ink:#E6EDE8; --muted:#9BABA2; --line:#2A3830; --line-strong:#38493F;
  --accent:#AEC486; --accent-ink:#17211B; --accent-soft:#25331F; --focus:#AEC486;
  --s-done:#7CC793; --s-done-bg:#1E3326; --s-prog:#E5B45C; --s-prog-bg:#3A2E17; --s-not:#A3B0A9; --s-not-bg:#262F2A;
  --s-plan:#AEC486; --s-plan-bg:#25331F; --s-late:#F08A7F; --s-late-bg:#3D1F1C;
  --p-high:#F08A7F; --p-med:#E5B45C; --p-low:#A3B0A9;
  --c-done:#79C08F; --c-prog:#C98A22; --c-not:#3E4B44; --c-hatch:rgba(255,255,255,.14); --grid:#24302A;
  --pop-shadow:0 14px 36px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.22); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1612; --surface:#17201B; --surface-2:#1C2721; --surface-3:#223028; --ink:#E6EDE8; --muted:#9BABA2; --line:#2A3830; --line-strong:#38493F;
  --accent:#AEC486; --accent-ink:#17211B; --accent-soft:#25331F; --focus:#AEC486;
  --s-done:#7CC793; --s-done-bg:#1E3326; --s-prog:#E5B45C; --s-prog-bg:#3A2E17; --s-not:#A3B0A9; --s-not-bg:#262F2A;
  --s-plan:#AEC486; --s-plan-bg:#25331F; --s-late:#F08A7F; --s-late-bg:#3D1F1C;
  --p-high:#F08A7F; --p-med:#E5B45C; --p-low:#A3B0A9;
  --c-done:#79C08F; --c-prog:#C98A22; --c-not:#3E4B44; --c-hatch:rgba(255,255,255,.14); --grid:#24302A;
  --pop-shadow:0 14px 36px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.22); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1240px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
svg.i{width:16px;height:16px;flex:none}

/* ===== Brand band ===== */
.band{background:var(--brand);color:#fff;position:relative;overflow:hidden}
.band .wrap{padding-block:26px 30px;position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:20px 32px;align-items:flex-end;justify-content:space-between}
.band-pattern{position:absolute;right:-30px;top:-20px;height:calc(100% + 40px);width:auto;z-index:0;pointer-events:none}
.brand-left{display:flex;flex-direction:column;gap:18px;min-width:0}
.logo{height:54px;width:auto;max-width:100%;display:block;align-self:flex-start;object-fit:contain}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--leaf);font-weight:700}
h1{margin:4px 0 0;font-size:clamp(24px,3.4vw,34px);line-height:1.15;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.title-row{display:flex;align-items:center;gap:6px}
.band-meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.weeknav{display:inline-flex;align-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:3px}
.weeknav .arrow{border:0;background:none;color:#fff;width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.weeknav .arrow:hover:not(:disabled){background:rgba(255,255,255,.14)}
.weeknav .arrow:disabled{opacity:.35;cursor:default}
.week-btn{border:0;background:none;color:#fff;font-weight:700;font-size:13px;padding:6px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:8px}
.week-btn:hover{background:rgba(255,255,255,.12)}
.week-btn .chev{opacity:.8;width:12px;height:12px}
.save-state{font-size:12px;color:rgba(255,255,255,.75);display:inline-flex;align-items:center;gap:6px}
.save-state i{width:7px;height:7px;border-radius:50%;background:var(--leaf);display:inline-block}
.save-state.busy i{background:#F2C46D}
.save-state.ro i{background:var(--mist)}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--line-strong);background:var(--surface-2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent);border-color:var(--accent);filter:brightness(1.07)}
.btn-leaf{background:var(--leaf);border-color:var(--leaf);color:#1E2B24}
.btn-leaf:hover{background:var(--leaf);border-color:var(--leaf);filter:brightness(1.05)}
.btn-ghost{border-color:transparent;background:none;color:var(--muted);padding:6px 10px}
.btn-ghost:hover{background:var(--surface-3);border-color:transparent;color:var(--ink)}
.btn-danger{color:var(--s-late);border-color:color-mix(in srgb,var(--s-late) 40%,var(--line))}
.btn-danger.armed{background:var(--s-late);color:#fff;border-color:var(--s-late)}
.icon-btn{border:1px solid transparent;background:none;border-radius:9px;width:32px;height:32px;display:inline-grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{border-color:var(--line);color:var(--ink);background:var(--surface-2)}
.icon-btn.title-edit{color:rgba(255,255,255,.65)}
.icon-btn.title-edit:hover{color:#fff;background:rgba(255,255,255,.12);border-color:transparent}

/* ===== Dropdown trigger + popover ===== */
.dd{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px 7px 14px;font-size:13px;white-space:nowrap;transition:border-color .15s,box-shadow .15s}
.dd:hover{border-color:var(--line-strong)}
.dd[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.dd .k{color:var(--muted);font-weight:500}
.dd .v{font-weight:700}
.dd .chev{width:12px;height:12px;color:var(--muted);transition:transform .2s var(--ease)}
.dd[aria-expanded="true"] .chev{transform:rotate(180deg)}
.dd.active{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.dd.block{width:100%;justify-content:space-between;border-radius:var(--r-sm);padding:10px 12px;background:var(--surface-2)}
.pop{position:fixed;z-index:80;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--pop-shadow);padding:6px;min-width:220px;max-width:min(340px,calc(100vw - 24px));max-height:min(420px,calc(100vh - 24px));overflow:auto}
@media (prefers-reduced-motion:no-preference){.pop{animation:popin .16s var(--ease)}@keyframes popin{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}}
.pop-h{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px}
.pop-sep{height:1px;background:var(--line);margin:5px 4px}
.opt{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:9px 10px;border-radius:9px;font-size:13px}
.opt:hover,.opt:focus-visible{background:var(--surface-3);outline:none}
.opt .lbl{flex:1;min-width:0;display:flex;flex-direction:column}
.opt .lbl b{font-weight:600}
.opt .lbl small{color:var(--muted);font-size:11px}
.opt .cnt{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--surface-3);border-radius:999px;padding:1px 8px}
.opt .tick{width:14px;height:14px;color:var(--accent);opacity:0;flex:none}
.opt[aria-selected="true"] .tick{opacity:1}
.opt[aria-selected="true"] .lbl b{color:var(--accent)}
.opt.cta{color:var(--accent);font-weight:700}
.opt > svg.i{color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--muted)}
.dot.done{background:var(--s-done)} .dot.prog{background:var(--s-prog)} .dot.not{background:var(--s-not)} .dot.plan{background:var(--s-plan)} .dot.late{background:var(--s-late)}
.dot.High{background:var(--p-high)} .dot.Medium{background:var(--p-med)} .dot.Low{background:var(--p-low)}

/* ===== Control bar ===== */
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.toolbar .wrap{display:flex;flex-direction:column;gap:10px;padding-block:12px}
.bar-row{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.tab{border:0;background:none;padding:7px 15px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted);display:inline-flex;gap:7px;align-items:center;white-space:nowrap;transition:background .2s,color .2s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tab .count{font-size:11px;font-weight:700;background:color-mix(in srgb,currentColor 14%,transparent);border-radius:999px;padding:0 7px}
.tab .count:empty{display:none}
.actions{display:flex;gap:8px;align-items:center}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{position:relative;flex:0 1 260px}
.search input{width:100%;padding:8px 32px 8px 34px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.search input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.search > .i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:26px;height:26px}
.seg-mini{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px}
.seg-mini button{border:0;background:none;border-radius:999px;padding:5px 11px;display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;color:var(--muted)}
.seg-mini button[aria-pressed="true"]{background:var(--surface-3);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));border-radius:999px;padding:3px 4px 3px 10px}
.chip button{border:0;background:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.chip button:hover{background:var(--surface);color:var(--ink)}
.chip button svg{width:11px;height:11px}

main{padding-block:24px 64px}
.view{display:flex;flex-direction:column;gap:22px}
.stack{display:flex;flex-direction:column;gap:12px}
.summary{font-size:15px;color:var(--muted);margin:0;max-width:82ch}
.summary b{color:var(--ink);font-weight:700}

/* ===== KPIs ===== */
.kpis{display:grid;grid-template-columns:minmax(230px,1.15fr) repeat(3,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0;text-align:left;transition:border-color .15s,transform .15s,box-shadow .15s}
button.kpi:hover{border-color:var(--line-strong);box-shadow:var(--shadow);transform:translateY(-1px)}
button.kpi.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.kpi .label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:7px}
.kpi .val{font-size:30px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--muted)}
.kpi-ring{flex-direction:row;align-items:center;gap:18px;background:var(--brand);border-color:var(--brand);color:#fff;grid-row:span 2}
.kpi-ring .label{color:var(--leaf)}
.kpi-ring .sub{color:rgba(255,255,255,.78)}
.ring{width:96px;height:96px;flex:none}
.kpi.alert .val{color:var(--s-late)} .kpi.warn .val{color:var(--s-prog)} .kpi.good .val{color:var(--s-done)}

.grid-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card h2{margin:0;font-size:15px;font-weight:700}
.card .note{margin:2px 0 14px;font-size:12px;color:var(--muted)}
.ws-row{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) 44px;gap:12px;align-items:center;padding:8px 6px;border-radius:8px;width:100%;border:0;background:none;text-align:left}
.ws-row:hover{background:var(--surface-2)}
.ws-row + .ws-row{border-top:1px dashed var(--line)}
.ws-name{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--surface-3);gap:2px}
.bar span{display:block;height:100%}
.ws-pct{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.due-list{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.due-list li{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 6px;border-radius:10px;cursor:pointer}
.due-list li:hover{background:var(--surface-2)}
.datebox{text-align:center;border:1px solid var(--line);border-radius:10px;padding:4px 0;line-height:1.1;background:var(--surface-2)}
.datebox b{display:block;font-size:17px;font-weight:800}
.datebox small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.due-list .t{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.due-list .w{font-size:12px;color:var(--muted)}
.empty-mini{color:var(--muted);font-size:13px;padding:10px 4px}

/* ===== Vertical workstream chart ===== */
.vchart{position:relative}
.vc-scroll{overflow-x:auto;overflow-y:visible;padding-top:8px;scrollbar-width:thin}
.vc-inner{position:relative;padding-left:30px;padding-top:26px}
.vc-plot{position:relative;height:250px;border-bottom:1px solid var(--line-strong)}
.vc-tick{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--grid)}
.vc-tick span{position:absolute;left:-30px;width:22px;text-align:right;transform:translateY(-50%);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.vc-cols,.vc-labels{display:flex;gap:6px;padding:0 6px}
.vc-cols{position:absolute;inset:0}
.vc-col{flex:1 1 0;min-width:58px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;border:0;background:none;padding:0;border-radius:10px 10px 0 0;position:relative;transition:background .2s}
.vc-col:hover,.vc-col:focus-visible,.vc-col.hot{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.vc-total{font-size:13px;font-weight:800;margin-bottom:6px;font-variant-numeric:tabular-nums;color:var(--ink)}
.vc-bar{width:min(48px,64%);display:flex;flex-direction:column-reverse;gap:2px;transform-origin:50% 100%;transition:opacity .2s}
.vc-seg{width:100%;flex:none}
.vc-bar .vc-seg:last-child{border-radius:5px 5px 0 0}
.vc-seg.done{background:var(--c-done)} .vc-seg.prog{background:var(--c-prog)}
.vc-seg.not{background-color:var(--c-not);background-image:repeating-linear-gradient(45deg,var(--c-hatch) 0 2px,transparent 2px 6px)}
.vc-cols:hover .vc-col:not(:hover) .vc-bar,.vc-cols.has-hot .vc-col:not(.hot) .vc-bar{opacity:.4}
.vc-late{position:absolute;bottom:4px;right:calc(50% - min(24px,32%) - 9px);width:16px;height:16px;border-radius:50%;background:var(--s-late);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;border:2px solid var(--surface)}
.vc-labels{margin-top:8px}
.vc-label{flex:1 1 0;min-width:58px;text-align:center;font-size:11px;font-weight:600;line-height:1.3;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.vc-label.hot{color:var(--ink)}
.vc-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font-size:12px;color:var(--muted)}
.vc-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.vc-tip{position:absolute;z-index:6;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--pop-shadow);padding:11px 13px;font-size:12px;width:240px;opacity:0;transform:translateY(4px);transition:opacity .14s,transform .14s}
.vc-tip.show{opacity:1;transform:none}
.vc-tip h4{margin:0 0 6px;font-size:13px;font-weight:800}
.vc-tip .tr{display:flex;align-items:center;gap:8px;padding:2px 0}
.vc-tip .tr i{width:9px;height:9px;border-radius:3px;flex:none}
.vc-tip .tr span{flex:1;color:var(--muted)}
.vc-tip .tr b{font-variant-numeric:tabular-nums}
.vc-tip .tnote{margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);color:var(--muted);line-height:1.45}
.vc-tip .tnote b{color:var(--ink);font-weight:600}
.vc-tip .tlate{color:var(--s-late);font-weight:700}
@media (prefers-reduced-motion:no-preference){
  .vchart.animate .vc-bar{animation:vcgrow .8s var(--ease) both;animation-delay:calc(var(--i) * 70ms)}
  .vchart.animate .vc-total,.vchart.animate .vc-late{animation:vcfade .5s ease-out both;animation-delay:calc(var(--i) * 70ms + .45s)}
  @keyframes vcgrow{from{transform:scaleY(.02)}to{transform:none}}
  @keyframes vcfade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
}

/* ===== Section heads ===== */
.section-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.section-head h2{margin:0;font-size:19px;font-weight:800}
.section-head .sh-r{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}

/* ===== Collapsible workstream sections ===== */
.wsx{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:border-color .2s,box-shadow .2s}
.wsx:hover{border-color:var(--line-strong)}
.wsx[data-expanded="true"]{box-shadow:var(--shadow)}
.wsx-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;border:0;background:none;padding:14px 18px;text-align:left}
.wsx-head:hover{background:var(--surface-2)}
.wsx-chev{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-3);color:var(--muted);transition:transform .25s var(--ease),background .2s,color .2s}
.wsx-chev svg{width:13px;height:13px}
.wsx[data-expanded="true"] .wsx-chev{transform:rotate(90deg);background:var(--accent);color:var(--accent-ink)}
.wsx-title{display:flex;flex-direction:column;gap:2px;min-width:0}
.wsx-title b{font-size:15px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wsx-title small{color:var(--muted);font-size:12px}
.wsx-right{display:flex;align-items:center;gap:10px}
.wsx-mini{width:120px;height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden;display:flex;gap:2px}
.wsx-mini span{display:block;height:100%}
.wsx-pct{font-size:13px;font-weight:800;min-width:40px;text-align:right;font-variant-numeric:tabular-nums}
.badge{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.badge.late{background:var(--s-late-bg);color:var(--s-late)}
.badge.hi{border:1px solid color-mix(in srgb,var(--p-high) 35%,var(--line));color:var(--p-high)}
.wsx-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.wsx[data-expanded="true"] .wsx-body{grid-template-rows:1fr}
.wsx-inner{overflow:hidden;min-height:0}
.wsx-pad{padding:4px 18px 18px;border-top:1px solid var(--line)}
.wsx-pad.cards{padding-top:16px}
@media (prefers-reduced-motion:reduce){.wsx-body,.wsx-chev{transition:none}}

/* ===== Cards ===== */
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;transition:border-color .2s,box-shadow .2s}
.wsx .task{background:var(--surface-2)}
.task:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.task.is-late{box-shadow:inset 3px 0 0 var(--s-late)}
.task-top{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.ws-tag{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.task h3{margin:0;font-size:15px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.status-btn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:999px;padding:4px 10px 4px 9px;font-size:12px;font-weight:700;white-space:nowrap;transition:filter .15s}
.status-btn:hover:not(:disabled){filter:brightness(.96)}
.status-btn .chev{width:10px;height:10px;opacity:.7}
.status-btn:disabled{cursor:default}
.status-btn i{width:7px;height:7px;border-radius:50%;background:currentColor}
.st-done{color:var(--s-done);background:var(--s-done-bg)} .st-prog{color:var(--s-prog);background:var(--s-prog-bg)}
.st-not{color:var(--s-not);background:var(--s-not-bg)} .st-plan{color:var(--s-plan);background:var(--s-plan-bg)} .st-late{color:var(--s-late);background:var(--s-late-bg)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.prio{border:1px solid var(--line);color:var(--muted)}
.prio.High{color:var(--p-high);border-color:color-mix(in srgb,var(--p-high) 35%,var(--line))}
.prio.Medium{color:var(--p-med);border-color:color-mix(in srgb,var(--p-med) 35%,var(--line))}
.due{font-size:12px;color:var(--muted);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.due svg{width:13px;height:13px;flex:none}
.due.late{color:var(--s-late);font-weight:700} .due.soon{color:var(--s-prog);font-weight:600}
.desc{margin:0;font-size:13px;color:var(--muted)}
.updates{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13px}
.updates li{position:relative;padding-left:16px;overflow-wrap:anywhere}
.updates li::before{content:"";position:absolute;left:2px;top:.6em;width:6px;height:6px;border-radius:2px 0 2px 0;background:var(--leaf);transform:rotate(45deg)}
.more{border:0;background:none;color:var(--accent);font-weight:700;font-size:12px;padding:0;align-self:flex-start;display:inline-flex;gap:5px;align-items:center}
.more svg{width:11px;height:11px;transition:transform .2s}
.more[aria-expanded="true"] svg{transform:rotate(180deg)}
.kpi-line{font-size:12px;border-top:1px dashed var(--line);padding-top:9px;color:var(--muted)}
.kpi-line b{color:var(--ink);font-weight:600}

/* ===== List rows ===== */
.rows{display:flex;flex-direction:column}
.rows-head,.lrow-main{display:grid;grid-template-columns:minmax(0,1fr) 168px 86px 150px 32px;gap:14px;align-items:center}
.rows-head{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:10px 8px 8px}
.lrow{border-top:1px solid var(--line)}
.lrow-main{padding:10px 8px;border-radius:10px;cursor:pointer}
.lrow-main:hover{background:var(--surface-2)}
.lrow.is-late .lrow-t b{color:var(--s-late)}
.lrow-t{display:flex;flex-direction:column;min-width:0}
.lrow-t b{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow-t small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow-x{width:30px;height:30px;border-radius:8px;border:0;background:none;display:grid;place-items:center;color:var(--muted)}
.lrow-x:hover{background:var(--surface-3);color:var(--ink)}
.lrow-x svg{width:12px;height:12px;transition:transform .25s var(--ease)}
.lrow[data-expanded="true"] .lrow-x svg{transform:rotate(180deg)}
.lrow[data-expanded="true"] .lrow-main{background:var(--surface-2)}
.lrow-det{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s var(--ease)}
.lrow[data-expanded="true"] .lrow-det{grid-template-rows:1fr}
.lrow-det > div{overflow:hidden;min-height:0}
.lrow-det .pad{padding:8px 8px 16px 8px;display:flex;flex-direction:column;gap:10px;max-width:820px}
.lrow-det .acts{display:flex;gap:8px}

/* ===== Upcoming columns ===== */
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;align-items:start}
.area{background:var(--surface-2);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.area-head{display:flex;align-items:center;gap:12px;padding:4px 4px 6px}
.area-icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--brand);color:var(--leaf);flex:none}
.area-icon svg{width:19px;height:19px}
.area-head h3{margin:0;font-size:15px;font-weight:800}
.area-head small{color:var(--muted);font-size:12px}
.area-progress{height:5px;border-radius:999px;background:var(--line);overflow:hidden;margin:0 4px}
.area-progress span{display:block;height:100%;background:var(--accent);border-radius:999px}
.area .task{padding:14px;background:var(--surface)}
.area .task h3{font-size:14px}
.add-inline{border:1.5px dashed var(--line-strong);background:none;border-radius:12px;padding:10px;color:var(--muted);font-weight:600;font-size:13px}
.add-inline:hover{border-color:var(--accent);color:var(--ink)}

/* ===== Timeline ===== */
.tl-wrap{overflow-x:auto}
.tl{min-width:720px;position:relative}
.tl-axis{display:grid;grid-template-columns:220px 1fr;font-size:11px;color:var(--muted);font-weight:600}
.tl-ticks{position:relative;height:26px;border-bottom:1px solid var(--line)}
.tl-ticks span{position:absolute;bottom:6px;transform:translateX(-50%);white-space:nowrap}
.tl-row{display:grid;grid-template-columns:220px 1fr;align-items:center;min-height:36px;border-bottom:1px dashed var(--line);cursor:pointer}
.tl-row:hover{background:var(--surface-2)}
.tl-label{font-size:13px;font-weight:600;padding:6px 12px 6px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-label small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.tl-track{position:relative;height:100%;min-height:36px}
.tl-span{position:absolute;top:50%;height:4px;transform:translateY(-50%);border-radius:999px;opacity:.35}
.tl-dot{position:absolute;top:50%;width:14px;height:14px;transform:translate(-50%,-50%) rotate(45deg);border-radius:3px 0 3px 0;border:2px solid var(--surface)}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--s-late);opacity:.8;pointer-events:none}
.tl-today span{position:absolute;top:32px;left:6px;font-size:10px;font-weight:700;color:var(--s-late);white-space:nowrap;letter-spacing:.06em;text-transform:uppercase}
.tl-group{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:14px 0 6px}

.empty{border:1.5px dashed var(--line-strong);border-radius:18px;padding:36px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty svg.pair{width:84px;height:42px}
.empty b{color:var(--ink);font-size:15px}
.notice{background:var(--accent-soft);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:16px}

/* ===== Drawer ===== */
.scrim{position:fixed;inset:0;background:rgba(16,24,20,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);background:var(--surface);z-index:51;transform:translateX(100%);transition:transform .28s var(--ease);display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.open{transform:none}
.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.drawer-head h2{margin:0;font-size:17px;font-weight:800}
.drawer-body{flex:1;overflow:auto;padding:20px 22px;display:flex;flex-direction:column;gap:16px}
.drawer-foot{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:14px 22px;border-top:1px solid var(--line);flex-wrap:wrap}
.drawer-foot .right{display:flex;gap:8px;margin-left:auto}
.field{display:flex;flex-direction:column;gap:7px}
.field > label,.field > .flabel{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.field input,.field textarea{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:var(--surface-2);width:100%}
.field input:focus,.field textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.field textarea{min-height:150px;resize:vertical;line-height:1.55}
.field .hint{font-size:11px;color:var(--muted)}
.seg{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:4px}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.form-err{color:var(--s-late);font-size:12px;font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45}
.check input{margin-top:2px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.check span span{color:var(--muted)}
.carry-list{margin:0;padding-left:22px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:3px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--brand-deep);color:#fff;border-radius:999px;padding:10px 18px;font-weight:600;font-size:13px;z-index:90;opacity:0;transition:all .25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot{color:var(--muted);font-size:12px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:16px;margin-top:10px}
.skel{background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;border-radius:var(--r);min-height:14px}
@media (prefers-reduced-motion:no-preference){
  .skel{animation:sh 1.4s infinite linear} @keyframes sh{to{background-position:-200% 0}}
  .view.enter{animation:fade .35s var(--ease)} @keyframes fade{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion:reduce){.drawer,.scrim,.toast{transition:none}}

@media (max-width:1020px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpi-ring{grid-column:1 / -1;grid-row:auto}
  .grid-2{grid-template-columns:1fr}
}

  .lrow-main{grid-template-columns:minmax(0,1fr) auto 30px;grid-template-areas:"t s x" "d p x";row-gap:6px}
  .lrow-main .c-t{grid-area:t} .lrow-main .c-d{grid-area:d} .lrow-main .c-p{grid-area:p;justify-self:end} .lrow-main .c-s{grid-area:s;justify-self:end} .lrow-main .c-x{grid-area:x}
  .wsx-mini{display:none}

  .band-pattern{opacity:.35}
  .logo{height:40px}
  .toolbar{position:static}
  .filters{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:2px;scrollbar-width:none}
  .filters .dd{flex:none}
  .seg-mini{width:100%} .seg-mini button{flex:1;justify-content:center}
  .tabs{width:100%} .tab{flex:1;justify-content:center;padding:7px 6px}
  .actions{width:100%} .actions > *{flex:1}
  .search{flex:1 0 100%}
  .filters{flex-wrap:wrap} .filters .dd{flex:1 0 auto;justify-content:center}
  .ws-row{grid-template-columns:minmax(0,1fr) 40px}
  .ws-row .bar{grid-column:1 / -1;grid-row:2}
  .wsx-head{padding:12px 14px;gap:10px} .wsx-pad{padding-inline:14px}
  .badge.hi{display:none}
}

/* decor */

.pine{fill:#3F6A44} .rock{fill:#A9A79C} .rock2{fill:#8C8A80} .palm-l{fill:#5E8A3E} .palm-t{stroke:#8A6E4B;stroke-width:3;stroke-linecap:round;fill:none}

.t-done{fill:#C6DA9F} .t-prog{fill:#B58A5E} .t-not{fill:#E9EFE3} .t-late{fill:#F2B3A9} .t-plan{fill:rgba(255,255,255,.35)}

/* castle + queen */
.c-wall-l{fill:#E9EEE7} .c-wall-r{fill:#CBD6CD} .c-wall-t{fill:#F7FAF5}
.c-roof{fill:#3A5446} .c-roof2{fill:#2F463A} .c-win{fill:#2F463A} .c-door{fill:#7C5A36}

  .ag.idle .ag-in{animation:breathe 2.6s ease-in-out infinite}

  .c-banner{animation:wave-f 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0 50%}
  .queen .q-body{animation:q-sway 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes q-sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}

  @keyframes twk{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}}
  .ring-fg{transition:stroke-dashoffset .6s}
}

/* ================= Popover (custom dropdowns) ================= */
const pop=$("#pop"); let popAnchor=null, popPick=null;
function openPop(anchor,items,onPick,opts){
  if(popAnchor===anchor){closePop();return}
  closePop(); popAnchor=anchor; popPick=onPick; opts=opts||{};
  pop.innerHTML=items.map((it,i)=>{
    if(it.head) return `<div class="pop-h">${esc(it.head)}</div>`;
    if(it.sep) return `<div class="pop-sep"></div>`;
    return `<button type="button" class="opt ${it.cta?"cta":""}" role="option" data-i="${i}" aria-selected="${!!it.sel}">${it.dot?`<span class="dot ${esc(it.dot)}"></span>`:""}${it.icon?`<svg class="i"><use href="#${it.icon}"/></svg>`:""}<span class="lbl"><b>${esc(it.label)}</b>${it.sub?`<small>${esc(it.sub)}</small>`:""}</span>${it.count!=null?`<span class="cnt">${it.count}</span>`:""}${it.cta||opts.noTick?"":`<svg class="tick"><use href="#i-check"/></svg>`}</button>`;
  }).join("");
  pop._items=items; pop.hidden=false;
  pop.style.minWidth=Math.max(opts.minWidth||220,anchor.offsetWidth)+"px";
  place(); anchor.setAttribute("aria-expanded","true");
  const sel=pop.querySelector('.opt[aria-selected="true"]')||pop.querySelector(".opt"); sel&&sel.focus({preventScroll:true});
}
function place(){
  if(!popAnchor) return;
  const r=popAnchor.getBoundingClientRect(), w=pop.offsetWidth, h=pop.offsetHeight;
  let left=Math.min(r.left,innerWidth-w-12); left=Math.max(12,left);
  let top=r.bottom+6; if(top+h>innerHeight-12&&r.top-h-6>12) top=r.top-h-6;
  pop.style.left=left+"px"; pop.style.top=top+"px";
}
function closePop(refocus){
  if(!popAnchor) return;
  popAnchor.setAttribute("aria-expanded","false"); const a=popAnchor; popAnchor=null; pop.hidden=true; pop.innerHTML="";
  if(refocus&&document.contains(a)) a.focus({preventScroll:true});
}
pop.addEventListener("click",e=>{const b=e.target.closest(".opt"); if(!b) return; const it=pop._items[+b.dataset.i]; const fn=popPick; closePop(true); fn&&fn(it);});
pop.addEventListener("keydown",e=>{
  const opts=[...pop.querySelectorAll(".opt")]; const i=opts.indexOf(document.activeElement);
  if(e.key==="ArrowDown"){e.preventDefault(); (opts[i+1]||opts[0]).focus()}
  else if(e.key==="ArrowUp"){e.preventDefault(); (opts[i-1]||opts[opts.length-1]).focus()}
  else if(e.key==="Home"){e.preventDefault(); opts[0].focus()} else if(e.key==="End"){e.preventDefault(); opts[opts.length-1].focus()}
  else if(e.key==="Escape"||e.key==="Tab"){e.preventDefault(); closePop(true)}
});
document.addEventListener("mousedown",e=>{ if(popAnchor&&!pop.contains(e.target)&&!popAnchor.contains(e.target)) closePop(); });
addEventListener("resize",()=>closePop());
addEventListener("scroll",e=>{ if(popAnchor&&!pop.contains(e.target)) closePop(); },true);

function tipHtml(name){

function showTip(col){

function renderTime(){
  const el=$("#view-time");

  if(!items.length){el.innerHTML=emptyState("Nothing to place on the timeline","Tasks with an end or target date appear here.",null);return}
  const R=pd(curWeek());
  const ts=items.map(t=>pd(t.end_date)); let min=Math.min(...ts,R)-4*MS, max=Math.max(...ts,R)+4*MS;
  const pos=t=>((t-min)/(max-min)*100).toFixed(2)+"%";
  const ticks=[]; let d=new Date(min); d.setUTCDate(d.getUTCDate()+((8-d.getUTCDay())%7));
  const step=(max-min)/MS>70?14:7;
  for(let t=d.getTime();t<=max;t+=step*MS) ticks.push(t);
  const color=t=>late(t)?"var(--s-late)":t.status==="Done"?"var(--s-done)":t.status==="In Progress"?"var(--s-prog)":t.kind==="upcoming"?"var(--accent)":"var(--s-not)";
  const sections=[[weekName(curWeek())+" workstreams",items.filter(t=>t.kind!=="upcoming")],["Upcoming: SEO, Google Ads, website",items.filter(t=>t.kind==="upcoming")]];

  <div class="tl-wrap"><div class="tl">
    <div class="tl-axis"><span></span><div class="tl-ticks">${ticks.map(t=>`<span style="left:${pos(t)}">${esc(new Date(t).toLocaleDateString("en-GB",{day:"numeric",month:"short",timeZone:"UTC"}))}</span>`).join("")}</div></div>
    ${sections.filter(s=>s[1].length).map(([label,list])=>`<div class="tl-group">${esc(label)}</div>`+list.sort((a,b)=>pd(a.end_date)-pd(b.end_date)).map(t=>{const e=pd(t.end_date); const a=Math.min(e,R), b=Math.max(e,R);
      return `<div class="tl-row" data-open="${esc(t.id)}" tabindex="0"><div class="tl-label" title="${esc(t.task)}">${esc(t.task)}<small>${esc(t.workstream)} · ${esc(fmt(t.end_date))}</small></div><div class="tl-track">${isOpen(t)?`<span class="tl-span" style="left:${pos(a)};width:calc(${pos(b)} - ${pos(a)});background:${color(t)}"></span>`:""}<span class="tl-dot" style="left:${pos(e)};background:${color(t)}" title="${esc(t.status)}"></span></div></div>`}).join("")).join("")}
    <div style="position:absolute;top:0;bottom:0;left:220px;right:0;pointer-events:none"><div class="tl-today" style="left:${pos(R)}"><span>Report</span></div></div>
  </div></div>
  <div class="legend"><span><i style="background:var(--s-done)"></i>Done</span><span><i style="background:var(--s-prog)"></i>In progress</span><span><i style="background:var(--s-not)"></i>Not started</span><span><i style="background:var(--accent)"></i>Planned</span><span><i style="background:var(--s-late)"></i>Overdue</span></div></div>`;
}

/* ================= Saving ================= */
let pending=0;
function saveState(){
  const el=$("#saveState");
  el.className="save-state"+(pending?" busy":"")+(S.canWrite?"":" ro");
  el.lastElementChild.textContent=!S.db?(S.loaded?"Read-only preview":"Connecting…"):!S.canWrite?"View only":pending?"Saving…":"All changes saved";
}
async function write(fn,okMsg){
  if(!S.db){toast("Saving isn't available in this view");return false}
  pending++; saveState();
  try{await fn(); if(okMsg) toast(okMsg); return true}
  catch(e){
    if(e&&e.code==="invalid_argument"){S.canWrite=false; toast("You have view-only access to this board"); render();}
    else if(e&&e.code==="quota_exceeded") toast("The board is full. Delete some old tasks and try again.");
    else toast("Couldn't save. Check your connection and try again.");
    return false;
  }finally{pending--; saveState();}
}
function toast(m){const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2600)}
function setStatus(id,val){
  const t=S.tasks.find(x=>x.id===id); if(!t||t.status===val) return;
  write(()=>S.db.doc("tasks/"+id).update({status:val,updatedAt:new Date().toISOString()}),"Status set to "+val);
}

async function saveDrawer(){
  if(S.mode==="settings"){
    const data=Object.assign({},S.settings,{title:$("#sTitle").value.trim()||"Weekly Workstream Update"});
    if(await write(()=>S.db.doc("settings/report").set(data),"Report title saved")) closeDrawer();
    return;
  }
  if(S.mode==="week") return createWeek();
  const task=$("#fTask").value.trim(), ws=$("#fWs").value.trim();
  if(!task||!ws){const e=$("#formErr"); e.textContent=!ws?"Add a "+(S.kind==="upcoming"?"focus area":"workstream")+".":"Add a task name."; e.hidden=false; return}
  const base=S.editing?Object.assign({},S.editing):{}; delete base.id;
  const maxOrder=Math.max(0,...S.tasks.map(t=>t.order||0));
  const sameWs=S.tasks.find(t=>t.workstream===ws&&(t.kind||"weekly")===S.kind);
  const data=Object.assign(base,{kind:S.kind,workstream:ws,task,end_date:$("#fDate").value||"",priority:S.fPrioV,status:S.fStatV,updates:$("#fUpd").value.split("\n").map(s=>s.trim()).filter(Boolean).join("\n"),updatedAt:new Date().toISOString()});
  if(S.kind==="upcoming"){data.kpi=$("#fKpi").value.trim(); data.description=$("#fDesc").value.trim();}
  else data.week=S.fWeek||curWeek();
  const newWeek=S.kind!=="upcoming"&&!weeks().includes(data.week);
  if(!S.editing) data.order=sameWs?(sameWs.order||0)+0.5:maxOrder+1;
  const ref=S.editing?S.db.doc("tasks/"+S.editing.id):S.db.collection("tasks").doc();
  const moved=S.kind!=="upcoming"&&data.week!==curWeek();
  const ok=await write(async()=>{ if(newWeek) await S.db.doc("settings/report").set(Object.assign({},S.settings,{weeks:[...new Set([...(S.settings.weeks||[]),data.week])]})); await ref.set(data); },S.editing?"Task updated":(moved?"Task added to "+weekName(data.week):"Task added"));
  if(ok){ if(moved) goWeek(data.week); closeDrawer(); }
}
async function deleteTask(){

async function createWeek(){
  const next=addDays(curWeek(),7); const carry=$("#wfCarry").checked, clear=$("#wfClear").checked;

  const ok=await write(async()=>{
    await S.db.doc("settings/report").set(Object.assign({},S.settings,{weeks:[...new Set([...(S.settings.weeks||[]),next])]}));
    for(const t of open){ const d=Object.assign({},t); delete d.id; d.week=next; d.carriedFrom=t.id; d.updatedAt=new Date().toISOString(); if(clear) d.updates=""; await S.db.collection("tasks").doc().set(d); }

function reportDateName(){return fmtLong(curWeek())}
function buildReport(){
  const W=weekly().sort(byOrder), U=upcoming(), st=stats(W);

  const kpi=(l,v)=>`<td style="padding:14px;background:#fff;border:1px solid ${C.line};border-radius:10px;width:16%"><div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:${C.mut};font-weight:700">${l}</div><div style="font-size:26px;font-weight:800;color:${C.ink}">${v}</div></td>`;

<table style="border-spacing:8px;margin:0 -8px"><tr>${kpi("Total tasks",st.total)}${kpi("Done",st.done)}${kpi("In progress",st.prog)}${kpi("Not started",st.not)}${kpi("High priority open",st.hi)}${kpi("Overdue",st.lt)}</tr></table>
<h2 style="margin:28px 0 10px;font-size:20px">Workstreams</h2>

function buildCsv(){

function buildEmail(){

  let s=`${S.settings.title} - ${weekName(curWeek())}\n\nSummary: ${st.done} of ${st.total} tasks complete, ${st.prog} in progress, ${st.hi} high-priority open, ${st.lt} overdue, ${st.soon} due in the next 7 days.\n`;

     return `<div class="kr"><span>${esc(l)}${u?` <em>${u}</em>`:""}</span><span>${nf(tg)}</span><span>${can?`<input inputmode="decimal" data-kpi="${k}" data-kf="actual" value="${esc(ac??"")}" placeholder="Actual">`:nf(ac)}</span><span>${nf(pv)}</span><span class="${ch==null?"":(ch>=0)===(KPIS.find(x=>x[0]===k)[3]>0)?"up":"down"}">${ch==null?"—":(ch>=0?"▲ ":"▼ ")+Math.abs(ch).toFixed(1)+"%"}</span><span><i class="kst ${sc}">${sl}</i></span></div>`}).join("")}</div>
   <p class="m-note">Targets come from the monthly plan. Change compares with last month's actual. For cost per lead and ad spend, lower is better.</p></section>
  <section class="m-card wide" style="--c:${PAL[1]}"><h3>3 · Workstream progress</h3>
   ${byWs.length?`<div class="ws-bars">${byWs.map(([n,list])=>{const dd=list.filter(t=>t.status==="Done").length, pp=list.filter(t=>t.status==="In Progress").length, c=wsColor(n); return `<div class="wb"><span class="wn"><i style="background:${c}"></i>${esc(n)}</span><div class="wt"><span style="width:${dd/list.length*100}%;background:${c}"></span><span style="width:${pp/list.length*100}%;background:${c};opacity:.45"></span></div><b>${dd}/${list.length}</b></div>`}).join("")}</div>`:`<p class="m-note">No board tasks fall in ${esc(monthName(m))}.</p>`}</section>
  <section class="m-card wide" style="--c:${PAL[2]}"><h3>4 · Plan vs actual</h3>${plans.length?`<div class="p-list">${plans.map(x=>planRow(x,can,true)).join("")}</div>`:`<p class="m-note">No activities in this month's plan. Add them on the Monthly plan tab.</p>`}</section>
  <section class="m-card wide" style="--c:${PAL[8]}"><h3>5 · Completed this month</h3>${d.length?`<ul class="done-list">${d.map(t=>`<li data-social="${esc(t.id)}"><i style="background:${wsColor(t.workstream)}"></i><b>${esc(t.task)}</b><small>${esc(t.workstream)} · ${esc(agentOf(t))} · ${esc(fmt(t.end_date))}</small></li>`).join("")}</ul>`:`<p class="m-note">No completed board tasks in this month yet.</p>`}</section>
  <section class="m-card wide" style="--c:${PAL[4]}"><h3>6 · Challenges, lessons and next month</h3><div class="m-two"><label class="m-lab">Challenges and lessons${ta("challenges",D.challenges,"What slowed us down and what we learned",can,4)}</label><label class="m-lab">Focus for ${esc(monthName(shiftMonth(m,1)))}${ta("next",D.next,"Top priorities for next month",can,4)}</label></div></section>`;
}
function reportHTML(m){
  const D=mdoc(m), PD=mdoc(shiftMonth(m,-1)), ts=monthTasks(m), plans=MON.plans.filter(p=>p.month===m), d=ts.filter(t=>t.status==="Done");
  const kv=(k,f,doc)=>num(((doc.kpis||{})[k]||{})[f]);
  const cell="border:1px solid #DCE3DA;padding:8px 10px;text-align:left;font-size:13px", th=cell+";background:#3A5446;color:#fff";
  const p=t=>`<p style="white-space:pre-wrap;margin:4px 0 14px">${esc(t||"—")}</p>`;
  return `<!doctype html><html><head><meta charset="utf-8"><title>Monthly marketing report · ${esc(monthName(m))}</title></head><body style="font-family:Montserrat,Arial,sans-serif;color:#1E2B24;max-width:900px;margin:30px auto;padding:0 20px">
  <div style="background:#3A5446;color:#fff;padding:22px 24px;border-radius:14px"><div style="color:#AEC486;font-size:12px;letter-spacing:.14em;font-weight:700">AL MAYS · MARKETING</div><h1 style="margin:6px 0 0">Monthly report · ${esc(monthName(m))}</h1></div>
  <h2>1. Executive summary</h2><b>Summary</b>${p(D.summary)}<b>Top achievements</b>${p(D.achievements)}<b>Main challenge</b>${p(D.challenge)}<b>Decision or support needed</b>${p(D.decision)}
  <h2>2. KPIs vs targets</h2><table style="border-collapse:collapse;width:100%"><tr>${["KPI","Target","Actual","Last month","Change","Status"].map(h=>`<th style="${th}">${h}</th>`).join("")}</tr>${KPIS.map(([k,l])=>{const tg=kv(k,"target",D),ac=kv(k,"actual",D),pv=kv(k,"actual",PD),ch=ac!=null&&pv?((ac-pv)/pv*100):null; return `<tr><td style="${cell}">${esc(l)}</td><td style="${cell}">${nf(tg)}</td><td style="${cell}">${nf(ac)}</td><td style="${cell}">${nf(pv)}</td><td style="${cell}">${ch==null?"—":ch.toFixed(1)+"%"}</td><td style="${cell}">${kpiStatus(k,tg,ac)[0]}</td></tr>`}).join("")}</table>
  <h2>3. Board tasks</h2><p>${d.length} of ${ts.length} tasks done.</p><ul>${d.map(t=>`<li>${esc(t.task)} <span style="color:#5F6F67">(${esc(t.workstream)})</span></li>`).join("")}</ul>
  <h2>4. Plan vs actual</h2><table style="border-collapse:collapse;width:100%"><tr>${["Activity","Workstream","Status","Budget (SAR)","Spent (SAR)"].map(h=>`<th style="${th}">${h}</th>`).join("")}</tr>${plans.map(x=>`<tr><td style="${cell}">${esc(x.title)}</td><td style="${cell}">${esc(x.workstream||"")}</td><td style="${cell}">${esc(x.status||"Planned")}</td><td style="${cell}">${nf(num(x.budget))}</td><td style="${cell}">${nf(num(x.spent))}</td></tr>`).join("")}</table>
  <h2>5. Challenges and lessons</h2>${p(D.challenges)}<h2>6. Focus for next month</h2>${p(D.next)}</body></html>`;
}
$("#page-month").addEventListener("click",e=>{
  const mv=e.target.closest("[data-mmove]"); if(mv){MON.month=shiftMonth(curMonth(),+mv.dataset.mmove); renderMonth(); return;}
  const tb=e.target.closest("[data-mtab]"); if(tb){MON.tab=tb.dataset.mtab; store.set("almays-mtab",MON.tab); renderMonth(); return;}
  if(e.target.closest("[data-padd]")){MON.adding=!MON.adding; renderMonth(); if(MON.adding) setTimeout(()=>{const f=$("#pTitle"); f&&f.focus()},30); return;}
  const dl=e.target.closest("[data-pdel]"); if(dl){ if(dl.dataset.armed) wWrite(()=>W.db.doc("plans/"+dl.dataset.pdel).delete(),"Activity removed"); else {dl.dataset.armed="1"; dl.style.color="var(--s-late)"; dl.title="Click again to delete"; setTimeout(()=>{delete dl.dataset.armed; dl.style.color=""},2500);} return;}
  if(e.target.closest("[data-mdl]")){const m=curMonth(); download(`Al Mays monthly report - ${monthName(m)}.html`,reportHTML(m)); return;}
});
$("#page-month").addEventListener("change",e=>{
  const t=e.target, m=curMonth();
  if(t.id==="mPick"&&t.value){MON.month=t.value; renderMonth(); return;}
  if(t.dataset.mfield){saveMonth(m,{[t.dataset.mfield]:t.value.trim()}); return;}
  if(t.dataset.kpi){const k=t.dataset.kpi, kp=JSON.parse(JSON.stringify(mdoc(m).kpis||{})); kp[k]=Object.assign({},kp[k],{[t.dataset.kf]:t.value.trim()}); saveMonth(m,{kpis:kp}); return;}
  if(t.dataset.pst){wWrite(()=>W.db.doc("plans/"+t.dataset.pst).update({status:t.value}),"Status updated"); return;}
  if(t.dataset.pspent!=null&&t.dataset.pspent){wWrite(()=>W.db.doc("plans/"+t.dataset.pspent).update({spent:t.value.trim()}),"Spend saved"); return;}
});
$("#page-month").addEventListener("submit",async e=>{
  e.preventDefault(); const v=id=>($("#"+id).value||"").trim(), title=v("pTitle"); if(!title){$("#pTitle").focus(); toast("Name the activity first"); return}
  const ok=await wWrite(()=>W.db.collection("plans").add({month:curMonth(),title,workstream:v("pWs"),channel:v("pCh"),owner:v("pOwner"),due:v("pDue"),budget:v("pBud"),spent:"",status:"Planned",uid:W.me||"",at:new Date().toISOString()}),"Added to the plan");
  if(ok){MON.adding=false; renderMonth();}
});
$("#page-month").addEventListener("focusout",()=>{ if(MON.pending) setTimeout(()=>{const a=document.activeElement; if(!(a&&$("#page-month").contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))){MON.pending=false; renderMonth();}},0); });
{const t=store.get("almays-mtab"); if(t==="plan"||t==="report") MON.tab=t;}

/* ================= Snapshot for viewers who are not signed in ================= */
function useSnap(){
  let sn=null; try{const el=document.getElementById("snapData"); if(el) sn=JSON.parse(el.textContent)}catch(e){}
  S.loaded=true; S.canWrite=false;
  if(sn){
    S.tasks=(sn.tasks||[]).slice(); S.settings=Object.assign({},S.settings,sn.settings||{});
    W.comments=sn.comments||[]; W.reactions=sn.reactions||[]; W.mgr=sn.manager||[];
    MON.docs={}; (sn.monthly||[]).forEach(d=>MON.docs[d.id]=d); MON.plans=sn.plans||[];
    let b=document.getElementById("snapBadge");
    if(!b){b=document.createElement("div"); b.id="snapBadge"; b.className="snap-badge"; b.setAttribute("role","status"); document.body.appendChild(b);}
    b.innerHTML=`<i></i><span>Copy from ${esc(fmtLong(sn.at))}</span><small>Offline copy · live data could not load</small>`;
  }else{
    $("#notice").innerHTML=`<div class="notice">The board could not connect. Check your internet and reload.</div>`;
  }
  render(); saveState();
}

/* ================= Boot ================= */
{const v=store.get("almays-view"); if(v&&["week","next","time"].includes(v)) S.view=v;
 S.week=null; /* everyone opens on the week that contains today */
 const so=store.get("almays-sort"); if(so&&SORTS.some(s=>s[0]===so)) S.sort=so;
 const la=store.get("almays-layout"); if(la==="list"||la==="cards") S.layout=la;
 try{const c=JSON.parse(store.get("almays-collapsed")||"[]"); if(Array.isArray(c)) S.collapsed=new Set(c)}catch(e){}}
setView(S.view); saveState();
(async()=>{
  const c=window.claude;
  if(!c||!c.use){useSnap(); return}
  const [db,user,dl]=await Promise.all([c.use("db"),c.use("user"),c.use("downloads")]);
  S.db=db; S.dl=dl; socialBoot(db,user);
  if(user){ try{const w=await user.can("data.write"); if(w===false) S.canWrite=false;}catch(e){} }
  if(!db){useSnap(); return}
  db.doc("settings/report").onSnapshot(s=>{ if(s.exists){S.settings=Object.assign({},S.settings,s.data())} render(); },()=>{});
  db.collection("tasks").onSnapshot(snap=>{
    S.tasks=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
    S.loaded=true; render(); saveState();
  },()=>{ if(!S.tasks.length) useSnap(); else {S.loaded=true; render();} });
})();
})();
